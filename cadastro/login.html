<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkNOW – Cadastro</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/png" href="../img/logo.png">
</head>
<body>
 
    <header>
        <h1><span class="logo-work">Work</span><span class="logo-now">NOW</span></h1>
        <nav>
           <a href="../index.html"><button>Entrar</button></a> 
        </nav>
    </header>
 
    <main>
 
        <section class="left-side">
            <h2>CRIE SUA CONTA <br> <span>E COMECE AGORA</span></h2>
            <p>Escolha como você deseja começar na plataforma.</p>
 
            <div class="tipo-conta">
                <div class="card-tipo ativo" onclick="selecionarTipo(this, 'trabalhador')">
                    <h3>👨‍💻 Trabalhador</h3>
                    <p>Buscar vagas e serviços.</p>
                </div>
                <div class="card-tipo" onclick="selecionarTipo(this, 'empregador')">
                    <h3>🏢 Empregador</h3>
                    <p>Publicar oportunidades.</p>
                </div>
            </div>
        </section>
 
        <section class="right-side">
            <h3>Seja Bem Vindo</h3>
            <h1>CRIAR SUA CONTA</h1>
 
            <form method="POST" onsubmit="return validarForm(event)">
 
                <input type="text" placeholder="Nome completo" required>
                <input type="email" placeholder="Email" required>
                <input type="password" id="senha" placeholder="Senha" required>
                <input type="password" id="confirmar" placeholder="Confirmar senha" required>
 
                <label class="termos">
                    <input type="checkbox" required>
                    Aceito os <a href="#">termos de uso</a>
                </label>
 
                <input type="submit" value="Cadastrar">
 
                <div class="register">
                    <span>Já tem conta?</span>
                    <a href="../index.html">Entrar!</a>
                </div>
        <!--GOOGLEEEEE-->
         <div class="divider"><span>ou continue com</span></div>
 
                <button type="button" class="btn-google">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Continuar com Google
                </button>
 
            </form>
        </section>
            </form>
        </section>
 
    </main>
 
    <script src="login.js">
    </script>
 
</body>
</html>
